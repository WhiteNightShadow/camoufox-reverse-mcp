name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
        runtime: ["legacy", "current"]
        include:
          - runtime: "legacy"
            camoufox-version: "0.4.11"
            playwright-version: "1.52.0"
          - runtime: "current"
            camoufox-version: "0.5.5"
            playwright-version: "1.60.0"

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Camoufox compatibility target
        run: >-
          python -m pip install
          "camoufox[geoip]==${{ matrix.camoufox-version }}"
          "playwright==${{ matrix.playwright-version }}"
      - name: Install package and test dependencies
        run: python -m pip install -e . pytest pytest-asyncio
      - name: Run tests
        run: pytest -q
